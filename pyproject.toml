[project]
name = "threat-agent-backend"
version = "0.1.0"
description = "실시간 보안 위협 대응 에이전트 백엔드 (PoC)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "feedparser>=6.0",
    "packaging>=24.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
